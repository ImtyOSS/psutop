[package]
name = "meltalarm-source-api"
description = "Driver/Source traits and the shared HID context, from MeltAlarm"
version = "0.3.9"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
meltalarm-model = { path = "../model" }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
disallowed_methods = "deny"
