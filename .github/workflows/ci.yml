name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    # The real build: the MSI source, NVML and the copied MeltAlarm crates with their read-only
    # allowlist test and clippy guard.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos:
    # The simulator-only build used for UI work.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
